plugins { id "com.android.application" }

android {
    namespace "io.github.hydriostatic.swshrecomp"
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "io.github.hydriostatic.swshrecomp"
        minSdk 33          // (Android 13, the AYN Thor's: Vulkan 1.3 entry points exported by libvulkan.so)
        targetSdk 35
        // CI: the run number (the in-app updater compares it, MainActivity); local builds: 1
        versionCode((System.getenv("BUILD_NUMBER") ?: "1") as int)
        versionName "0.1.0-thor." + (System.getenv("BUILD_NUMBER") ?: "dev")
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DDEPS_PREFIX=" + (System.getenv("DEPS_PREFIX") ?: ""), "-DSDL_SRC=" + (System.getenv("SDL_SRC") ?: ""),
                          "-DANDROID_STL=c++_shared"
            }
        }
    }
    externalNativeBuild { cmake { path "../CMakeLists.txt"; version "3.22.1" } }
    // One key for every build, so a new APK installs over the old one and keeps its data (the built game code). The
    // repository secrets SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD replace the key in android/signing/ when set.
    signingConfigs {
        thor {
            storeFile file(System.getenv("SIGNING_KEYSTORE") ?: "../signing/swsh-thor.jks")
            storePassword System.getenv("SIGNING_PASSWORD") ?: "uxEIJJDgzQkNZUvxcn3b"
            keyAlias "swshthor"
            keyPassword System.getenv("SIGNING_PASSWORD") ?: "uxEIJJDgzQkNZUvxcn3b"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.thor }
        debug { signingConfig signingConfigs.thor }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
